<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#287d75">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="轉乘助手">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>巴士／小巴實時到站與轉乘助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
  <main class="shell">
    <header class="app-header mb-4">
      <div>
        <h1 id="appTitle" class="text-xl font-bold">巴士／小巴實時到站與轉乘助手</h1>
        <p id="appSubtitle" class="muted app-tagline">九巴／龍運／城巴／嶼巴／專線小巴，港鐵及輕鐵</p>
      </div>
      <div class="app-controls">
        <button id="langBtn" class="tab" type="button">English</button>
        <button id="guideBtn" class="tab" type="button">使用說明</button>
        <select id="refresh" class="field">
          <option value="15">15 秒</option>
          <option value="30" selected>30 秒</option>
        </select>
      </div>
    </header>
    <div id="status" class="note">正在載入路線資料…</div>
    <p id="a2hs" class="muted"></p>
    <nav class="tabs my-5">
      <button class="tab active" data-tab="arrivals">巴士／小巴</button>
      <button class="tab" data-tab="transfer">轉乘助手</button>
      <button class="tab" data-tab="mtr">港鐵／輕鐵</button>
      <button class="tab" data-tab="home">我的回家路線</button>
    </nav>

    <section id="arrivals" class="panel active">
      <div class="card">
        <h2 id="arrivalsHeading" class="text-lg font-bold">九巴／龍運／城巴／嶼巴／專線小巴實時到站</h2>
        <div class="search-row mt-3">
          <input id="arrivalRoute" class="field" placeholder="路線，例如 286C、962、11 或 811">
          <button id="arrivalFind" class="btn">查詢</button>
        </div>
        <div id="arrivalVariants"></div>
        <div id="arrivalStops"></div>
        <div id="arrivalDest"></div>
        <div id="arrivalOutput"></div>
      </div>
    </section>

    <section id="transfer" class="panel">
      <div class="card">
        <h2 id="transferHeading" class="text-lg font-bold">轉乘助手</h2>
        <label class="block mt-3"><input id="nearby" type="checkbox" checked> <span id="nearbyLabel">同時顯示附近車站的其他選擇</span></label>
        <label class="block mt-2"><span id="radiusLabel">附近範圍</span>
          <select id="radius" class="field mt-1">
            <option value="150">150 米</option>
            <option value="250" selected>250 米</option>
            <option value="400">400 米</option>
          </select>
        </label>
        <div id="firstBox" class="mt-4">
          <b id="firstRouteLabel">第一程路線</b>
          <div class="search-row mt-1">
            <input id="firstRoute" class="field" placeholder="路線，例如 286C、962 或 811">
            <button id="firstFind" class="btn">查詢</button>
          </div>
          <div id="firstVariants"></div>
        </div>
        <div id="firstSummary"></div>
        <div id="firstStops"></div>
        <div id="destinationBox" class="mt-4">
          <b id="destLabel">終點站</b>
          <div class="search-row mt-1">
            <input id="destinationInput" class="field" placeholder="輸入站名">
            <button id="destinationFind" class="btn">查詢</button>
          </div>
          <div id="destinationResults"></div>
        </div>
        <div id="destinationSummary"></div>
        <button id="transferFind" class="btn btn-block mt-4">查看可轉乘班次</button>
        <div id="transferOutput"></div>
      </div>
    </section>

    <section id="mtr" class="panel">
      <div class="card">
        <h2 id="mtrHeading" class="text-lg font-bold">港鐵／輕鐵下班車</h2>
        <label class="block mt-3"><span id="mtrLineLabel">路綫</span>
          <select id="mtrLine" class="field mt-1"></select>
        </label>
        <label class="block mt-3"><span id="mtrStationLabel">車站</span>
          <select id="mtrStation" class="field mt-1"></select>
        </label>
        <label class="block mt-3"><span id="mtrDestLabel">此程終點（可留空）</span>
          <select id="mtrDest" class="field mt-1"></select>
        </label>
        <button id="mtrFind" class="btn btn-block mt-4">顯示下班車</button>
        <div id="mtrOutput"></div>
      </div>
    </section>

    <section id="home" class="panel">
      <div class="card">
        <h2 id="homeHeading" class="text-lg font-bold">我的回家路線</h2>
        <p id="homeHelp" class="muted">無需登入。儲存在這部裝置上，可從巴士／小巴、轉乘或港鐵頁面按儲存。換瀏覽器或清除網站資料後就不會再見到。</p>
        <div id="homeOutput"></div>
      </div>
    </section>

    <section id="guide" class="panel">
      <div class="card" id="guideCard"></div>
    </section>
  </main>
  <!-- standalone-bundle -->
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="mtr-data.js"></script>
  <script src="standalone.js"></script>
  <!-- /standalone-bundle -->
</body>
</html>
