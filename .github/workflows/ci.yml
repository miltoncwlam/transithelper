name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev > /tmp/tb-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3001 >/dev/null; then
              echo html ready
              break
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then
              echo 'dev server did not start'
              tail -n 80 /tmp/tb-dev.log || true
              exit 1
            fi
          done
          echo warming directory
          for i in $(seq 1 40); do
            curl -sS -o /tmp/tb-routes.json -w 'http %{http_code}\n' --max-time 90 http://127.0.0.1:3001/api/kmb/routes || true
            n=$(python3 -c "import json; d=json.load(open('/tmp/tb-routes.json')); print(len(d.get('data') or []))" 2>/dev/null || echo 0)
            echo "try $i routes $n"
            if [ "${n:-0}" -gt 100 ]; then
              echo directory ready
              exit 0
            fi
            sleep 3
          done
          echo 'directory did not load'
          tail -n 80 /tmp/tb-dev.log || true
          exit 1
      - run: npm test
      - run: npm run smoke
        env:
          SMOKE_BASE: http://127.0.0.1:3001
